<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" fill="none">
  <defs>
    <clipPath id="frontPhotoClip">
      <rect x="-152" y="-98" width="294" height="186" rx="14" />
    </clipPath>
  </defs>

  <!-- Outer Dark Frame matching user reference -->
  <rect width="600" height="800" fill="#2c3038" />

  <!-- Main Neutral Gray Background matching user reference -->
  <rect x="14" y="14" width="572" height="772" rx="10" fill="#c0c4cc" />

  <!-- Center Graphic: Two Overlapping Photo Cards -->
  <g transform="translate(295, 340)">
    
    <!-- Back Photo Card (Tilted) -->
    <g transform="rotate(-15) translate(-15, -10)">
      <rect x="-160" y="-105" width="290" height="195" rx="18" fill="#cbd0d8" stroke="#ffffff" stroke-width="15" stroke-linejoin="round" />
      <circle cx="50" cy="-35" r="22" fill="#ffffff" />
    </g>

    <!-- Front Photo Card -->
    <g transform="translate(15, 20)">
      <!-- Frame Background -->
      <rect x="-160" y="-105" width="310" height="200" rx="20" fill="#c0c4cc" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" />

      <!-- Sun Circle in Top Right -->
      <circle cx="70" cy="-32" r="24" fill="#ffffff" />

      <!-- Mountain Peaks in White -->
      <g clip-path="url(#frontPhotoClip)">
        <path d="M-155 95 L-55 -15 L35 55 L85 10 L155 95 Z" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- Clean Neutral Dimension Callout (Charcoal & White, No Blue) -->
  <g transform="translate(0, 560)">
    <rect x="185" y="0" width="230" height="46" rx="23" fill="#2c3038" />
    <text x="300" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">600 × 800 PX</text>
    <text x="300" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Recommended Ratio: 3:4 (Portrait)</text>
    <text x="300" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle">Auto-fits any dimension upload cleanly</text>
  </g>
</svg>
